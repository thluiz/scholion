<script>
(function() {
  var MIN_COL = 220;
  var GAP = 16;
  var grids = document.querySelectorAll('.scholion-grid');
  if (!grids.length || !window.ResizeObserver) return;

  var ro = new ResizeObserver(function(entries) {
    for (var i = 0; i < entries.length; i++) {
      var w = entries[i].contentRect.width;
      var cols = Math.max(1, Math.floor((w + GAP) / (MIN_COL + GAP)));
      entries[i].target.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    }
  });

  grids.forEach(function(g) { ro.observe(g); });
})();
</script>
