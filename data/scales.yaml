# Escalas de 0 a 5 exibidas nas notas.
#
# Cada entrada vira um campo opcional de frontmatter: se a nota declarar
# `rating: 4`, a escala "Nota" renderiza com 4 de 5 ícones cheios.
# Escala ausente do frontmatter não renderiza nada.
#
# O rótulo pode ter qualquer largura: na página da nota as escalas saem num
# grid cuja coluna de rótulos se dimensiona pelo mais largo (ver .scholion-scales
# em custom.css). Não há largura fixa a ajustar ao acrescentar uma escala.
#
# Lista (não mapa) porque a ordem aqui é a ordem de exibição — mapa em Hugo
# itera por ordem alfabética da chave.
#
# Para criar uma escala nova, acrescentar uma entrada. Nenhum template muda.

- key: rating
  label: "Nota"
  emoji: "🎫"

- key: morbius
  label: "Morbius"
  emoji: "🧛"

- key: laughs
  label: "Gargalhadas"
  emoji: "🤣"
