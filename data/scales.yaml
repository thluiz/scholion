# Escalas de 0 a 5 exibidas nas notas.
#
# Cada entrada vira um campo opcional de frontmatter: se a nota declarar
# `rating: 4`, a escala "Nota" renderiza com 4 de 5 pipocas cheias.
# Escala ausente do frontmatter não renderiza nada.
#
# Lista (não mapa) porque a ordem aqui é a ordem de exibição — mapa em Hugo
# itera por ordem alfabética da chave.
#
# Para criar uma escala nova, acrescentar uma entrada. Nenhum template muda.

# O 🎟️ é text-default (U+1F39F). O seletor de variação U+FE0F logo depois é
# obrigatório para renderizar colorido — não remover ao editar este arquivo.
# Onde a plataforma insistir em monocromático, os slots vazios contam só com o
# opacity reforçado em .scholion-scale--rating (ver custom.css).
- key: rating
  label: "Nota"
  emoji: "🎟️"

- key: morbius
  label: "Morbius"
  emoji: "🧛"
